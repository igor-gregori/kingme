<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Damas brasileiras contra uma IA de bitboards que roda inteira no navegador" />
    <title>kingme</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, evitando um flash de tema errado.
      (function () {
        var pref
        try {
          pref = JSON.parse(localStorage.getItem('kingme:theme'))
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
